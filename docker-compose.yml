services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omnicivitas
      POSTGRES_PASSWORD: omnicivitas
      POSTGRES_DB: omnicivitas
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicivitas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    environment:
      # Sobreescriben los valores de .env pensados para correr en el host
      # (localhost): dentro de la red de Compose, los servicios se resuelven
      # por nombre.
      DATABASE_URL: postgresql+asyncpg://omnicivitas:omnicivitas@db:5432/omnicivitas
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  db_data:
